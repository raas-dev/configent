images:
  - location: https://geo.mirror.pkgbuild.com/images/v20260901.583572/Arch-Linux-x86_64-cloudimg-20260901.583572.qcow2
    arch: x86_64
    digest: sha256:e3e688f97a71b265ce202905a504253f60f3680cf57d011a45411c43bedfa930
  - location: https://github.com/SuperGregM/archlinux-arm-lima/releases/download/20260915-0/Arch-Linux-aarch64-cloudimg-20260915.0.qcow2.xz
    arch: aarch64
    digest: sha256:f35a5547b351562945ad5df5b5c92d170c471d7eb8f4dd9f908d320f7bebe1b4
  # Fallback to the latest release image.
  # Hint: run `limactl prune` to invalidate the cache
  - location: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
    arch: x86_64
  - location: https://github.com/SuperGregM/archlinux-arm-lima/releases/latest/download/Arch-Linux-aarch64-cloudimg-latest.qcow2.xz
    arch: aarch64

mounts:
  - location: "~/Downloads"
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  - mode: system
    script: |
      #!/bin/sh
      ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      curl -fsSL https://raw.githubusercontent.com/raas-dev/configent/main/install.sh | sh &

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true

# https://lima-vm.io/docs/config/network/#lima-user-v2-network
networks:
  - lima: user-v2
