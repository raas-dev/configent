images:
  - location: https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-10-20260914.0.x86_64.qcow2
    arch: x86_64
    digest: sha256:a09f32a8002d4f89cdd5491c96cc1a9d58099c97750fec52219c3658d5fca211
  - location: https://cloud.centos.org/centos/10-stream/aarch64/images/CentOS-Stream-GenericCloud-10-20260914.0.aarch64.qcow2
    arch: aarch64
    digest: sha256:182e6a63cd1cb6c3d953c08ed8a6ad6423bac85cffe04be16b79a50db7c4fb7b
  # Fallback to the latest release image.
  # Hint: run `limactl prune` to invalidate the cache
  - location: https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2
    arch: x86_64
  - location: https://cloud.centos.org/centos/10-stream/aarch64/images/CentOS-Stream-GenericCloud-10-latest.aarch64.qcow2
    arch: aarch64

mountTypesUnsupported: ["9p"]
mounts:
  - location: "~/Downloads"
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      curl -fsSL https://raw.githubusercontent.com/raas-dev/configent/main/install.sh | sh &

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true

# https://lima-vm.io/docs/config/network/#lima-user-v2-network
networks:
  - lima: user-v2
