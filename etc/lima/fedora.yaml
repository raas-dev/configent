images:
  - location: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
    arch: x86_64
    digest: sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f
  - location: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/aarch64/images/Fedora-Cloud-Base-Generic-44-1.7.aarch64.qcow2
    arch: aarch64
    digest: sha256:55c60a3b80d3616a08705afd0459e75fe9f03c54aba7a46e4002a41a72fa0d5b

#cpus: 4          # default: 4
memory: "8GiB" # default: "4GiB"
#disk: "100GiB"   # default: "100GiB"

mounts:
  - location: "~/Downloads"
    writable: true

ssh:
  forwardAgent: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v podman >/dev/null 2>&1 && test -e /etc/lima-podman && exit 0
      if [ ! -e /etc/systemd/system/podman.socket.d/override.conf ]; then
        mkdir -p /etc/systemd/system/podman.socket.d
        cat <<-EOF >/etc/systemd/system/podman.socket.d/override.conf
        [Socket]
        SocketUser={{.User}}
      EOF
      fi
      if [ ! -e /etc/tmpfiles.d/podman.conf ]; then
        mkdir -p /etc/tmpfiles.d
        echo "d /run/podman 0700 {{.User}} -" > /etc/tmpfiles.d/podman.conf
      fi
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v podman >/dev/null 2>&1 && test -e /etc/lima-podman && exit 0
      dnf -y install --best podman && touch /etc/lima-podman
  - mode: system
    script: |
      #!/bin/bash
      sed -i 's/short-name-mode = "enforcing"/short-name-mode = "disabled"/g' /etc/containers/registries.conf
  # - mode: system
  #   script: |
  #     #!/bin/bash
  #     set -eux -o pipefail
  #     systemctl --system enable --now podman.socket
  - mode: system
    script: |
      #!/bin/bash
      # Keep the user systemd instance (and rootless podman.socket) alive
      # without an active login session, similarly to install_docker
      loginctl enable-linger {{.User}}
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      systemctl --user enable --now podman.socket
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      curl -fsSL https://raw.githubusercontent.com/raas-dev/configent/main/install.sh | sh &

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until command -v podman >/dev/null 2>&1; do sleep 3; done"; then
        echo >&2 "podman is not installed yet"
        exit 1
      fi
    hint: See "/var/log/cloud-init-output.log" in the guest

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true

# https://lima-vm.io/docs/config/network/#lima-user-v2-network
networks:
  - lima: user-v2

portForwards:
  # user podman
  - guestSocket: "/run/user/{{.UID}}/podman/podman.sock"
    hostSocket: "{{.Dir}}/sock/podman.sock"
  # user docker
  - guestSocket: "/run/user/{{.UID}}/docker.sock"
    hostSocket: "{{.Dir}}/sock/docker_rootless.sock"
  # rootful podman
  #- guestSocket: "/run/podman/podman.sock"
  #  hostSocket: "{{.Dir}}/sock/podman.sock"
