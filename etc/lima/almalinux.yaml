images:
  - location: https://repo.almalinux.org/almalinux/10.2/cloud/x86_64/images/AlmaLinux-10-GenericCloud-10.2-20260817.0.x86_64.qcow2
    arch: x86_64
    digest: sha256:bc59485c4828861a15887e30ff1bb913f0f16202fd7286208518f4814da1e10a
  - location: https://repo.almalinux.org/almalinux/10.2/cloud/aarch64/images/AlmaLinux-10-GenericCloud-10.2-20260817.0.aarch64.qcow2
    arch: aarch64
    digest: sha256:b1203c2ecc74b5529ffd9ef7675c6914fa80b4a29fe6ddeeffde78817ca850bd
  # Fallback to the latest release image.
  # Hint: run `limactl prune` to invalidate the cache
  - location: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
    arch: x86_64
  - location: https://repo.almalinux.org/almalinux/10/cloud/aarch64/images/AlmaLinux-10-GenericCloud-latest.aarch64.qcow2
    arch: aarch64

mountTypesUnsupported: ["9p"]
mounts:
  - location: "~/Downloads"
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      curl -fsSL https://raw.githubusercontent.com/raas-dev/configent/main/install.sh | sh &

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true

# https://lima-vm.io/docs/config/network/#lima-user-v2-network
networks:
  - lima: user-v2
