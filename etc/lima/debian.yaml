images:
  - location: https://cloud.debian.org/images/cloud/trixie/20260914-2601/debian-13-genericcloud-amd64-20260914-2601.qcow2
    arch: x86_64
    digest: sha512:95e110dfcdbd0ed8a82a75ed9579802f9950cabf51a810dcc6388e81bc778188713878b9f28d583a0ea602fbf48b35996ae9ad37f584166d8fbd6489df248f53
  - location: https://cloud.debian.org/images/cloud/trixie/20260914-2601/debian-13-genericcloud-arm64-20260914-2601.qcow2
    arch: aarch64
    digest: sha512:9eeabc75e74a682fcaff785f6c1f6896b486159397201f51f58298a8f95990f6debb8058b6969ca95cf6823f6e8058dd6f8589ba940a194b2780cd7f95771d69
  # Fallback to the latest release image.
  # Hint: run `limactl prune` to invalidate the cache
  - location: https://cloud.debian.org/images/cloud/trixie/daily/latest/debian-13-genericcloud-amd64-daily.qcow2
    arch: x86_64
  - location: https://cloud.debian.org/images/cloud/trixie/daily/latest/debian-13-genericcloud-arm64-daily.qcow2
    arch: aarch64

#cpus: 4          # default: 4
memory: "8GiB" # default: "4GiB"
#disk: "100GiB"   # default: "100GiB"

mountTypesUnsupported: ["9p"]
mounts:
  - location: "~/Downloads"
    writable: true
  # apt package archives — per-distro (debian)
  - location: "~/.cache/lima-provision/debian/apt-archives"
    mountPoint: /var/cache/apt/archives
    writable: true
  # mise tool download archives
  - location: "~/.cache/lima-provision/mise/downloads"
    mountPoint: "{{.Home}}/.local/share/mise/downloads"
    writable: true
  # ~/.cargo — crates, registry, bin
  - location: "~/.cache/lima-provision/cargo"
    mountPoint: "{{.Home}}/.cargo"
    writable: true
  # npm registry cache
  - location: "~/.cache/lima-provision/npm"
    mountPoint: "{{.Home}}/.npm"
    writable: true
  # omp plugins (node_modules)
  - location: "~/.cache/lima-provision/omp/plugins"
    mountPoint: "{{.Home}}/.omp/plugins"
    writable: true
  # pi agent — npm packages + skills
  - location: "~/.cache/lima-provision/pi/agent"
    mountPoint: "{{.Home}}/.pi/agent"
    writable: true
  # rust toolchains
  - location: "~/.cache/lima-provision/rustup"
    mountPoint: "{{.Home}}/.rustup"
    writable: true
  # guest ~/.cache — uv, pip, go-build, …
  - location: "~/.cache/lima-provision/cache"
    mountPoint: "{{.Home}}/.cache"
    writable: true
  # cloakbrowser Stealth Chromium
  - location: "~/.cache/lima-provision/cloakbrowser"
    mountPoint: "{{.Home}}/.cloakbrowser"
    writable: true

# keep downloaded archives so the host-cached mise/downloads mount is reused
env:
  MISE_ALWAYS_KEEP_DOWNLOAD: "1"
  MISE_PREFER_OFFLINE: "true"

ssh:
  forwardAgent: true
  overVsock: false # true by default - slow (2026-09)

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      curl -fsSL https://raw.githubusercontent.com/raas-dev/configent/main/install.sh | sh &

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until command -v docker >/dev/null 2>&1; do sleep 3; done"; then
        echo >&2 "docker is not installed yet"
        exit 1
      fi
      if ! timeout 30s bash -c "until pgrep dockerd; do sleep 3; done"; then
        echo >&2 "dockerd is not running"
        exit 1
      fi
    hint: See "/var/log/cloud-init-output.log" in the guest

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true

# https://lima-vm.io/docs/config/network/#lima-user-v2-network
networks:
  - lima: user-v2

portForwards:
  # rootful docker
  - guestSocket: "/var/run/docker.sock"
    hostSocket: "{{.Dir}}/sock/docker.sock"
  # user docker
  - guestSocket: "/run/user/{{.UID}}/docker.sock"
    hostSocket: "{{.Dir}}/sock/docker_rootless.sock"
  # user podman
  - guestSocket: "/run/user/{{.UID}}/podman/podman.sock"
    hostSocket: "{{.Dir}}/sock/podman.sock"
