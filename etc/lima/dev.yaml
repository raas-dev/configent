param:
  internal_netplanOptional: "true"

#cpus: 4          # default: 4
memory: "8GiB" # default: "4GiB"
#disk: "100GiB"   # default: "100GiB"

video:
  # none: no host window — in-VM Xorg uses dummy driver, streamed via selkies
  display: none

# home persists via ~/limahome host dir (mounts below), survives `limactl delete`

mounts:
  # guest home persistence — backed by host dir, survives `limactl delete`
  - location: "~/limahome"
    mountPoint: /mnt/lima-limahome
    writable: true
  # apt package archives — per-distro (ubuntu)
  - location: "~/.cache/lima-provision/ubuntu/apt-archives"
    mountPoint: /var/cache/apt/archives
    writable: true
  # selkies deb + chromium-extensions
  - location: "~/.cache/lima-provision/xorg"
    mountPoint: /mnt/lima-provision
    writable: true

ssh:
  forwardAgent: true

containerd:
  system: false
  user: false

# keep downloaded archives so the host-cached mise/downloads mount is reused
env:
  MISE_ALWAYS_KEEP_DOWNLOAD: "1"
  MISE_PREFER_OFFLINE: "true"

provision:
  - mode: boot # every boot: bind the persistent limahome mount over the lima user's home
    script: |
      #!/bin/sh
      # persistent home on host ~/limahome, reverse-mounted here (standard
      # mounts entry). we bind-mount it over the user's home; content
      # survives `limactl delete`.
      # bootcmd runs before lima sets up its mounts; systemd-run blocks here (no
      # dbus yet) and hangs the whole boot. nohup child may die at bootcmd exit —
      # that is fine, the system-mode provision script below redoes the bind.
      cat >/usr/local/sbin/limahome-bind.sh <<'EOF'
      #!/bin/sh
      # lima sets guest user uid to the host uid (e.g. 501) — do not guess by
      # uid>=1000; lima.env holds the authoritative name/home.
      # (string-split to avoid the literal: lima warns on lima-cidata env refs in scripts)
      HOMEP=$(sed -n "s/^LIMA_""CIDATA""_HOME=//p" /mnt/lima-cidata/lima.env)
      MNT=/mnt/lima-limahome
      [ -n "$HOMEP" ] || exit 0
      i=0; until mountpoint -q "$MNT"; do sleep 2; i=$((i+1)); [ "$i" -lt 60 ] || exit 0; done
      # home dir starts blank (new host dir); bootstrap (install.sh, user
      # provision) builds home from the configent repo. only .ssh is seeded —
      # cloud-init puts authorized_keys in HOMEP and lima needs it to ssh in.
      if [ ! -f "$MNT/.ssh/authorized_keys" ]; then
        mkdir -p "$MNT/.ssh" && cp -a "$HOMEP/.ssh/." "$MNT/.ssh/"
      fi
      [ "$(stat -c %u "$MNT")" = "$(stat -c %u "$HOMEP")" ] || chown -R "$(stat -c %u "$HOMEP")":"$(stat -c %g "$HOMEP")" "$MNT"
      mountpoint -q "$HOMEP" || mount --bind "$MNT" "$HOMEP"
      EOF
      chmod +x /usr/local/sbin/limahome-bind.sh
      nohup /usr/local/sbin/limahome-bind.sh >/dev/null 2>&1 &
      exit 0
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
      # runs after lima's mounts are up: ensure persistent home bind (idempotent)
      /usr/local/sbin/limahome-bind.sh || true
  - mode: system
    file: xorg/desktop.sh
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      curl -fsSL https://raw.githubusercontent.com/raas-dev/configent/main/install.sh | sh &

message: |
  Selkies desktop (xorg + xfce + chromium):
    https://localhost:8443  (TLS, self-signed)
    http://localhost:8080   (plain)

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true
