param:
  internal_netplanOptional: "true"

#cpus: 4          # default: 4
memory: "8GiB" # default: "4GiB"
#disk: "100GiB"   # default: "100GiB"

video:
  # none: no host window — in-VM Xorg uses dummy driver, streamed via selkies
  display: none

# home persists via ~/limahome host dir (mounts below), survives `limactl delete`

mounts:
  # guest home persistence — backed by host dir, survives `limactl delete`
  - location: "~/limahome"
    mountPoint: /mnt/lima-limahome
    writable: true
  - location: "~/configent"
    writable: false
  - location: "~/Downloads"
    writable: true
  # apt package archives — per-distro (ubuntu)
  - location: "~/.cache/lima-provision/ubuntu/apt-archives"
    mountPoint: /var/cache/apt/archives
    writable: true
  # selkies deb + chromium-extensions
  - location: "~/.cache/lima-provision/xorg"
    mountPoint: /mnt/lima-provision
    writable: true

ssh:
  forwardAgent: true

containerd:
  system: false
  user: false

provision:
  # persistent home: bind host ~/limahome (virtiofs via the mounts entry
  # above) over the guest user's home so content survives `limactl delete`.
  # mode:boot = cloud-init bootcmd (Init stage): before cidata, env, and
  # virtiofs mounts — too early to mount anything. So bootcmd only installs a
  # per-boot script; cloud-init's scripts_per_boot stage (Final) runs it every
  # boot, after lima's own 00-lima.boot.sh / 05-lima-mounts.sh have mounted
  # virtiofs. The cidata iso (ro) stays mounted for the whole boot, so
  # lima.env is readable there on every boot, not just the first.
  - mode: boot
    script: |
      #!/bin/sh
      set -eu
      install -d /var/lib/cloud/scripts/per-boot
      cat >/var/lib/cloud/scripts/per-boot/50-limahome-bind.sh <<'EOS'
      #!/bin/sh
      set -eu
      MNT=/mnt/lima-limahome
      # (string-split to avoid the literal: lima warns on lima-cidata env refs)
      HOMEDIR=$(sed -n "s/^LIMA_""CIDATA""_HOME=//p" /mnt/lima-cidata/lima.env)
      [ -n "$HOMEDIR" ] && [ -d "$HOMEDIR" ] || {
        echo "limahome-bind: bad home '$HOMEDIR'" >&2; exit 1; }
      mountpoint -q "$MNT" || {
        echo "limahome-bind: $MNT not mounted (05-lima-mounts not run?)" >&2; exit 1; }
      # first boot: limahome is empty; cloud-init seeded authorized_keys into
      # the original home — copy them over so lima can still ssh in after bind
      if [ ! -f "$MNT/.ssh/authorized_keys" ]; then
        mkdir -p "$MNT/.ssh" && cp -a "$HOMEDIR/.ssh/." "$MNT/.ssh/"
      fi
      mountpoint -q "$HOMEDIR" || mount --bind "$MNT" "$HOMEDIR"
      EOS
      chmod +x /var/lib/cloud/scripts/per-boot/50-limahome-bind.sh
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      export SETUP_GUI=true
      export SETUP_DOCKER=false
      export SETUP_PODMAN=false
      "/Users/asyrjasalo/configent/install.sh" &

# selkies web UI binds guest loopback; lima auto-forward only covers 0.0.0.0/:: binds,
# so forward explicitly (guestIP default 127.0.0.1 reaches it)
portForwards:
  - guestPort: 8080
    hostPort: 8080
  - guestPort: 8443
    hostPort: 8443

probes:
  # readiness = install finished AND services up AND web UI answering on 8080
  - description: "Selkies desktop to be ready"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 180s bash -c "until [ -f /var/tmp/desktop.done ] \
        && systemctl is-active --quiet xorg-dummy.service \
        && systemctl is-active --quiet selkies-tls.service \
        && curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:8080/; do sleep 2; done"; then
        echo >&2 "Selkies desktop not ready"
        exit 1
      fi
    hint: See "/var/log/cloud-init-output.log" in the guest

message: |
  Selkies desktop (xorg + gnome + chromium):
    https://localhost:8443  (TLS, self-signed)
    http://localhost:8080   (plain)

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true
