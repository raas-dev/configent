param:
  internal_netplanOptional: "true"

#cpus: 4          # default: 4
memory: "8GiB" # default: "4GiB"
#disk: "100GiB"   # default: "100GiB"

video:
  display: none

mounts:
  - location: "~/configent"
    mountPoint: "{{.Home}}/configent"
    writable: true
  - location: "~/Downloads"
    writable: true
  # provisioning cache — guest writes selkies deb + chromium-extensions tarball
  # here on first run; rm -rf ~/.cache/lima-provision to force refresh
  - location: "~/.cache/lima-provision"
    mountPoint: /mnt/lima-provision
    writable: true
  # mise tool downloads only — cached installs would skip postinstall hooks;
  # needs MISE_ALWAYS_KEEP_DOWNLOAD=1 (env below), mise deletes archives otherwise
  - location: "~/.cache/lima-provision/mise/downloads"
    mountPoint: "{{.Home}}/.local/share/mise/downloads"
    writable: true
  # cargo crates + cargo-binstall github tarballs, shared across re-provisions
  - location: "~/.cache/lima-provision/cargo"
    mountPoint: "{{.Home}}/.cargo"
    writable: true
  # npm registry cache — pi postinstall re-downloads otherwise
  - location: "~/.cache/lima-provision/npm"
    mountPoint: "{{.Home}}/.npm"
  # bun cache — oh-my-pi + omp plugins install via bun
  - location: "~/.cache/lima-provision/bun"
    mountPoint: "{{.Home}}/.bun"
  # uv cache — pipx.uvx=true routes all pipx installs through uv, which uses
  # ~/.cache/uv (not pip's cache); without this every pipx:* tool re-downloads
  - location: "~/.cache/lima-provision/uv"
    mountPoint: "{{.Home}}/.cache/uv"
    writable: true
  # cloakbrowser Stealth Chromium (656M) — postinstall 'cloakbrowser install'
  # skips download when version-pinned dir already present
  - location: "~/.cache/lima-provision/cloakbrowser"
    mountPoint: "{{.Home}}/.cloakbrowser"
    writable: true
  # rust toolchain (rustup), mise rust backend re-downloads otherwise
  - location: "~/.cache/lima-provision/rustup"
    mountPoint: "{{.Home}}/.rustup"
    writable: true
  # go module cache (GOPATH=$HOME/.go in bin/install_mise) — go:* tools skip
  # module re-downloads from proxy.golang.org
  - location: "~/.cache/lima-provision/go-mod"
    mountPoint: "{{.Home}}/.go/pkg/mod"
    writable: true
  # azure-cli state — az bicep binary, az extensions; postinstall_azure
  # re-downloads these into ephemeral home unless persisted
  - location: "~/.cache/lima-provision/az/azure"
    mountPoint: "{{.Home}}/.azure"
    writable: true

ssh:
  forwardAgent: true

containerd:
  system: false
  user: false

# keep downloaded archives so the host-cached mise/downloads mount is
# reused across re-provisions; mise deletes them by default
env:
  MISE_ALWAYS_KEEP_DOWNLOAD: "1"

provision:
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  #- mode: system
  #  file: xorg/desktop.sh
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      PARALLEL=true "${HOME}/configent/install.sh" &

