  - location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release-20260908/ubuntu-26.04-minimal-cloudimg-amd64.img
    arch: x86_64
    digest: sha256:c0c48d8f774eaef2ded8680cc310c772b52eb5ce4f136b2d16db68a0194baf13
  - location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release-20260908/ubuntu-26.04-minimal-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:671baf09e0a21681979c3a0436d530dfa2d70ed627d1527ebb174f7b5b6b5719
  # Fallback to the latest release image.
  # Hint: run `limactl prune` to invalidate the cache
  - location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release/ubuntu-26.04-minimal-cloudimg-amd64.img
    arch: x86_64
  - location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release/ubuntu-26.04-minimal-cloudimg-arm64.img
    arch: aarch64

param:
  internal_netplanOptional: "true"

#cpus: 4          # default: 4
memory: "8GiB" # default: "4GiB"
#disk: "100GiB"   # default: "100GiB"

video:
  # none: no host window — in-VM Xorg uses dummy driver, streamed via selkies
  display: none

mounts:
  - location: "~/configent"
    mountPoint: "{{.Home}}/configent"
    writable: true
  - location: "~/Downloads"
    writable: true
  # apt package archives — per-distro (ubuntu)
  - location: "~/.cache/lima-provision/ubuntu/apt-archives"
    mountPoint: /var/cache/apt/archives
    writable: true
  # mise tool download archives
  - location: "~/.cache/lima-provision/mise/downloads"
    mountPoint: "{{.Home}}/.local/share/mise/downloads"
    writable: true
  # ~/.cargo — crates, registry, bin
  - location: "~/.cache/lima-provision/cargo"
    mountPoint: "{{.Home}}/.cargo"
    writable: true
  # npm registry cache
  - location: "~/.cache/lima-provision/npm"
    mountPoint: "{{.Home}}/.npm"
    writable: true
  # omp plugins (node_modules)
  - location: "~/.cache/lima-provision/omp/plugins"
    mountPoint: "{{.Home}}/.omp/plugins"
    writable: true
  # pi agent — npm packages + skills
  - location: "~/.cache/lima-provision/pi/agent"
    mountPoint: "{{.Home}}/.pi/agent"
    writable: true
  # rust toolchains
  - location: "~/.cache/lima-provision/rustup"
    mountPoint: "{{.Home}}/.rustup"
    writable: true
  # guest ~/.cache — uv, pip, go-build, …
  - location: "~/.cache/lima-provision/cache"
    mountPoint: "{{.Home}}/.cache"
    writable: true
  # cloakbrowser Stealth Chromium
  - location: "~/.cache/lima-provision/cloakbrowser"
    mountPoint: "{{.Home}}/.cloakbrowser"
    writable: true
  # selkies deb + chromium-extensions
  - location: "~/.cache/lima-provision/xorg"
    mountPoint: /mnt/lima-provision
    writable: true

ssh:
  forwardAgent: true

containerd:
  system: false
  user: false

# keep downloaded archives so the host-cached mise/downloads mount is reused
env:
  MISE_ALWAYS_KEEP_DOWNLOAD: "1"
  MISE_PREFER_OFFLINE: "true"

provision:
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  - mode: system
    file: xorg/desktop.sh
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      "${HOME}/configent/install.sh" &

probes:
  - description: "Xorg to be installed"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 60s bash -c "until command -v Xorg >/dev/null 2>&1; do sleep 1; done"; then
        echo >&2 "Xorg is not installed yet"
        exit 1
      fi
    hint: See "/var/log/cloud-init-output.log" in the guest
  - description: "Selkies to be installed"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 60s bash -c "until command -v selkies >/dev/null 2>&1; do sleep 1; done"; then
        echo >&2 "Selkies is not installed yet"
        exit 1
      fi
    hint: See "/var/log/cloud-init-output.log" in the guest

message: |
  Selkies desktop (xorg + xfce + chromium):
    https://localhost:8443  (TLS, self-signed)
    http://localhost:8080   (plain)

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true
