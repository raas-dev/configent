images:
  - location: https://github.com/lima-vm/alpine-lima/releases/download/v0.2.50/alpine-lima-std-3.24.1-x86_64.iso
    arch: x86_64
    digest: sha512:db4ee2f9933be29762718ad56bfa61246d29078fc2404529235ca1acc61fbea387100e86d9f4c2a141eafaba0e46940b53993ea5177fcf4bf34cb3d9b59dd738
  - location: https://github.com/lima-vm/alpine-lima/releases/download/v0.2.50/alpine-lima-std-3.24.1-aarch64.iso
    arch: aarch64
    digest: sha512:fc90af52c78dcf15ac134beb146f7704cd00859412962081f7023b5bb49d4a887a08dfbf761b824a2375ed90a614f89c0b16b9da93e3bcc97e94e8ba52e21c09

mounts:
  - location: "~/Downloads"
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  # Reverse lima's ash-as-bash hack
  # https://github.com/lima-vm/lima/blob/master/pkg/cidata/cidata.TEMPLATE.d/boot/01-alpine-ash-as-bash.sh
  - mode: system
    script: |
      #!/bin/sh
      rm -f /bin/bash
      sudo apk add bash
      ln -sf /bin/bash /bin/ash
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      wget -q -O - https://raw.githubusercontent.com/raas-dev/configent/main/install.sh | sh &

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true

# https://lima-vm.io/docs/config/network/#lima-user-v2-network
networks:
  - lima: user-v2
