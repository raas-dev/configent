minimumLimaVersion: 2.1.0

images:
  - location: "https://updates.cdn-apple.com/2026SpringFCS/fullrestores/140-24263/B95838F0-6815-4F0B-A039-156526C081AD/UniversalMac_26.5.2_25F84_Restore.ipsw"
    arch: "aarch64"
    digest: "sha256:065abd295a1a456a46c1155217eab92ee95816520ec9aeed83f249f074f68a04"

os: Darwin
arch: aarch64
vmType: vz

#cpus: 4          # default: 4
memory: "8GiB" # default: "4GiB"
#disk: "100GiB"   # default: "100GiB"

video:
  display: default

mounts:
  - location: "~/Downloads"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eu
      user=$(dscl . -list /Users UniqueID | awk '$2 >= 500 && $2 < 65534 {print $1; exit}')
      home=$(dscl . -read "/Users/$user" NFSHomeDirectory | awk '{print $2}')
      # dscl -passwd needs the old password even as root; Lima stores it in ~/password
      if [ -f "$home/password" ]; then
        dscl . -passwd "/Users/$user" "$(cat "$home/password")" lima
        rm -f "$home/password"
      fi
      # Lima disables passwordless sudo on macOS guests; re-enable it
      echo "$user ALL=(ALL) NOPASSWD: ALL" >"/etc/sudoers.d/$user"
      chmod 0440 "/etc/sudoers.d/$user"
      visudo -cf "/etc/sudoers.d/$user"
  # Port of lima master suppressFirstLoginScreens (limactl 2.2.0 lacks it)
  - mode: system
    script: |
      #!/bin/bash
      set -eu
      user=$(dscl . -list /Users UniqueID | awk '$2 >= 500 && $2 < 65534 {print $1; exit}')
      home=$(dscl . -read "/Users/$user" NFSHomeDirectory | awk '{print $2}')
      uid=$(dscl . -read "/Users/$user" UniqueID | awk '{print $2}')
      build=$(sw_vers -buildVersion)
      ver=$(sw_vers -productVersion)
      prefs="$home/Library/Preferences"
      mkdir -p "$prefs"
      p="$prefs/com.apple.SetupAssistant.plist"
      rm -f "$p"
      pl=/usr/libexec/PlistBuddy
      for k in DidSeeAccessibility DidSeeActivationLock DidSeeAppStore DidSeeAppearanceSetup DidSeeApplePaySetup DidSeeCloudSetup DidSeeLockdownMode DidSeePrivacy DidSeeScreenTime DidSeeSetupSequence DidSeeSiriSetup DidSeeSyncSetup DidSeeSyncSetup2 DidSeeTermsOfAddress DidSeeTouchIDSetup DidSeeiCloudLoginForStorageServices SkipExpressSettingsUpdating SkipFirstLoginOptimization; do
        $pl -c "Add :$k bool true" "$p" >/dev/null
      done
      $pl -c "Add :LastPreLoginTasksPerformedBuild string $build" "$p" >/dev/null
      $pl -c "Add :LastPreLoginTasksPerformedVersion string $ver" "$p" >/dev/null
      $pl -c "Add :LastSeenAgeRangeSelectionProductVersion string $ver" "$p" >/dev/null
      $pl -c "Add :LastSeenBuddyBuildVersion string $build" "$p" >/dev/null
      $pl -c "Add :LastSeenCloudProductVersion string $ver" "$p" >/dev/null
      $pl -c "Add :LastSeenDiagnosticsProductVersion string $ver" "$p" >/dev/null
      $pl -c "Add :MiniBuddyLaunchReason integer 0" "$p" >/dev/null
      $pl -c "Add :MiniBuddyShouldLaunchToResumeSetup bool false" "$p" >/dev/null
      # chown -R dies on SIP-protected template plists (madrid, AddressBook, ...):
      # aborted this script before kcpassword/autoLoginUser -> first-boot login screen
      chown "$uid" "$p"
      # MiniLauncher checks this cookie: "Skipbuddy cookie set, skipping minibuddy"
      touch /private/var/db/.skipbuddy
      # sudo -u defaults fails pre-login (cfprefsd "Could not write domain") -> write plist file directly
      lw="$prefs/com.apple.loginwindow.plist"
      $pl -c "Set :MiniBuddyLaunch false" "$lw" 2>/dev/null || $pl -c "Add :MiniBuddyLaunch bool false" "$lw"
      chown "$uid" "$lw"
      # Auto-login: /etc/kcpassword is 'lima' XOR key\x7D89... padded to 12 bytes
      printf '11e03f42d2bcddeaa3ada7ac' | xxd -r -p > /etc/kcpassword
      chmod 600 /etc/kcpassword
      defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "$user"
      # System Settings writes this too (SystemAdministration framework)
      defaults write /Library/Preferences/com.apple.loginwindow autoLoginUserUID -int "$uid"
      # loginwindow evaluates autologin only at boot: restarting it via killall is NOT
      # a boot context (SecurityAgent: "no autologin because no conditions ..."),
      # so first boot reboots once after the config exists; later boots find it ready
      if [ ! -f /private/var/db/.lima-autologin ]; then
        touch /private/var/db/.lima-autologin
        /sbin/shutdown -r now
      fi
      # no Spotlight indexing in a VM
      mdutil -a -i off >/dev/null 2>&1 || true
      defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticCheckEnabled -bool true
      defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticDownload -bool false
      defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticallyInstallMacOSUpdates -bool false
      defaults write /Library/Preferences/com.apple.SoftwareUpdate ConfigDataInstall -bool true
      defaults write /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall -bool false
  # macOS guest ignores mountPoint: one virtiofs device automounts whole at
  # /Volumes/My Shared Files with per-mount lima-<hash-of-location> subdirs.
  # Expose the shares at the exact same paths as on the host.
  - mode: system
    script: |
      #!/bin/bash
      set -eu
      user=$(dscl . -list /Users UniqueID | awk '$2 >= 500 && $2 < 65534 {print $1; exit}')
      sh="/Volumes/My Shared Files"
      mkdir -p "/Users/$user"
      ln -hfs "$sh/lima-512960f069fc5687" "/Users/$user/Downloads"
      # configent share only present when created via vv (--mount ~/configent)
      if [ -d "$sh/lima-faf5b629f04b2902" ]; then
        ln -hfs "$sh/lima-faf5b629f04b2902" "/Users/$user/configent"
      fi

