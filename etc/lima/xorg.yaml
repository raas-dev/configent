images:
  # Ubuntu 26.04 (resolute) minimal — latest Ubuntu version, latest release
  - location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release-20260908/ubuntu-26.04-minimal-cloudimg-amd64.img
    arch: x86_64
    digest: sha256:c0c48d8f774eaef2ded8680cc310c772b52eb5ce4f136b2d16db68a0194baf13
  - location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release-20260908/ubuntu-26.04-minimal-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:671baf09e0a21681979c3a0436d530dfa2d70ed627d1527ebb174f7b5b6b5719
  # Fallback to the latest release image.
  # Hint: run `limactl prune` to invalidate the cache
  - location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release/ubuntu-26.04-minimal-cloudimg-amd64.img
    arch: x86_64
  - location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release/ubuntu-26.04-minimal-cloudimg-arm64.img
    arch: aarch64

#cpus: 4          # default: 4
memory: "8GiB" # default: "4GiB"
#disk: "100GiB"   # default: "100GiB"

mounts:
  - location: "~/Downloads"
    writable: true
  # provisioning cache — rebuild after cloakbrowser/chromium bump:
  #   limactl shell xorg -- sudo tar czf - -C / opt/cloakbrowser usr/local/share/extensions \
  #     > ~/.cache/lima-provision/chromium-extensions.$(limactl info xorg | jq -r .arch).tar.gz
  # selkies deb: curl -LO ~/.cache/lima-provision/ from github selkies v2.0.0rc0 release
  - location: "~/.cache/lima-provision"
    mountPoint: /mnt/lima-provision
    writable: false
  # persistent apt deb cache — survives recreate, 2nd+ runs unpack only
  - location: "~/.cache/lima-provision/apt-archives"
    mountPoint: /var/cache/apt/archives
    writable: true

containerd:
  system: false
  user: false

ssh:
  forwardAgent: true

video:
  display: vz

provision:
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v Xorg >/dev/null 2>&1 && command -v selkies >/dev/null 2>&1 && exit 0
      export DEBIAN_FRONTEND=noninteractive
      APTOPT='-o Acquire::Retries=3 -o Acquire::Languages=none -o Dpkg::Use-Pty=0 -o Dpkg::Options::=--force-unsafe-io'
      apt-get update $APTOPT
      apt-get install -y --no-install-recommends $APTOPT xorg lightdm accountsservice python3-pip
      # chromium + extensions (~198MB): host cache tarball if present, else pip/network fallback
      TARBALL=/mnt/lima-provision/chromium-extensions.$(dpkg --print-architecture).tar.gz
      if [ -f "$TARBALL" ]; then
        ( tar xzf "$TARBALL" -C / && touch /tmp/cb.ok /tmp/ext.ok ) >/tmp/cb.log 2>&1 &
      else
        ( pip3 install --no-cache-dir --break-system-packages --root-user-action=ignore --ignore-installed typing_extensions cloakbrowser \
            && cloakbrowser install \
            && touch /tmp/cb.ok ) >/tmp/cb.log 2>&1 &
      fi
      CB=$!
      # slim 1.4.1 auto_login leaves "Untitled window" (Debian #1117831) - lightdm instead
      mkdir -p /etc/lightdm/lightdm.conf.d
      printf "[Seat:*]\nautologin-user={{.User}}\nautologin-user-timeout=0\nautologin-session=lightdm-xsession\n" \
        >/etc/lightdm/lightdm.conf.d/50-autologin.conf
      chmod 644 /etc/lightdm/lightdm.conf.d/50-autologin.conf
      # greeter background = desktop wallpaper so login+session match
      mkdir -p /etc/lightdm/lightdm-gtk-greeter.conf.d
      printf '[greeter]\nbackground = /usr/share/xfce4/backdrops/xubuntu-wallpaper.png\nuser-background = false\n' \
        >/etc/lightdm/lightdm-gtk-greeter.conf.d/50-wallpaper.conf
      # localectl fails in cloud-init (located absent) — write XKB conf directly
      install -d /etc/X11/xorg.conf.d
      printf 'Section "InputClass"\n  Identifier "system-keyboard"\n  MatchIsKeyboard "on"\n  Option "XkbLayout" "fi"\nEndSection\n' >/etc/X11/xorg.conf.d/00-keyboard.conf
      sed -i 's/^XKBLAYOUT=.*/XKBLAYOUT="fi"/' /etc/default/keyboard
      # webtop ubuntu-xfce style desktop; xubuntu-wallpapers owns backdrops/xubuntu-wallpaper.png symlink
      apt-get install -y --no-install-recommends $APTOPT xfce4 xfce4-terminal thunar mousepad ristretto dbus-x11 pipewire pipewire-pulse wireplumber xubuntu-wallpapers
      rm -f /etc/xdg/autostart/xfce4-power-manager.desktop \
        /etc/xdg/autostart/xscreensaver.desktop \
        /usr/share/xfce4/panel/plugins/power-manager-plugin.desktop
      update-alternatives --set x-session-manager /usr/bin/xfce4-session
      # panel: stock /etc/xdg/xfce4/panel/default.xml from xfce4-panel pkg — no override needed
      # backdrop: xubuntu default wallpaper
      install -d /etc/xdg/xfce4/xfconf/xfce-perchannel-xml
      cat >/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml <<'DESK'
      <?xml version="1.0" encoding="UTF-8"?>
      <channel name="xfce4-desktop" version="1.0">
        <property name="backdrop" type="empty" value="">
          <property name="screen0" type="empty" value="">
            <property name="monitor0" type="empty" value="">
              <property name="workspace0" type="empty" value="">
                <property name="color-style" type="int" value="0"/>
                <property name="image-style" type="int" value="5"/>
                <property name="last-image" type="string" value="/usr/share/xfce4/backdrops/xubuntu-wallpaper.png"/>
              </property>
            </property>
            <property name="monitorVirtual-1" type="empty" value="">
              <property name="workspace0" type="empty" value="">
                <property name="color-style" type="int" value="0"/>
                <property name="image-style" type="int" value="5"/>
                <property name="last-image" type="string" value="/usr/share/xfce4/backdrops/xubuntu-wallpaper.png"/>
              </property>
            </property>
          </property>
        </property>
      </channel>
      DESK
      # selkies pinned to v2.0.0rc0 (latest with ubuntu26.04 debs; API lookup rate-limits)
      case "$(dpkg --print-architecture)" in
        amd64) DEB=selkies_2.0.0.rc0-1.ubuntu26.04_amd64.deb ;;
        arm64) DEB=selkies_2.0.0.rc0-1.ubuntu26.04_arm64.deb ;;
      esac
      SELKDEB=/mnt/lima-provision/${DEB}
      if [ -f "$SELKDEB" ]; then
        apt-get install -y --no-install-recommends $APTOPT "$SELKDEB" socat unzip libnspr4 libnss3
      else
        curl -fsSLO --retry 5 --retry-all-errors "https://github.com/selkies-project/selkies/releases/download/v2.0.0rc0/${DEB}"
        apt-get install -y --no-install-recommends $APTOPT "./${DEB}" socat unzip libnspr4 libnss3
        rm -f "./${DEB}"
      fi
      # extensions download overlaps remaining config (cached tarball already includes them)
      EXT=
      if [ ! -f "$TARBALL" ]; then
        (
        install -d /usr/local/share/extensions
        for pair in i-still-dont-care-about-cookies:edibdbjcniadpccecjdfdjjppcpchdlm ublock-origin-lite:ddkjiahejlhfcafbddmgiahcphecmpfh; do
          name=${pair%%:*}; id=${pair##*:}
          curl -fsSL -o /tmp/$name.crx "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=138.0.0.0&acceptformat=crx2,crx3&x=id%3D${id}%26uc"
          python3 -c "import sys;d=open('/tmp/$name.crx','rb').read();open('/tmp/$name.zip','wb').write(d[d.find(b'PK\\x03\\x04'):])"
          mkdir -p /usr/local/share/extensions/$name
          unzip -oq /tmp/$name.zip -d /usr/local/share/extensions/$name
          rm -rf /usr/local/share/extensions/$name/_metadata
        done
        touch /tmp/ext.ok
        ) >/tmp/ext.log 2>&1 &
        EXT=$!
      fi
      cat >/usr/local/bin/selkies-session <<'EOF'
      #!/bin/bash
      # attaches selkies to the running Xorg/xfce session on :0
      export DISPLAY="${DISPLAY:-:0}"
      export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
      # start pipewire stack if pulse socket absent
      if [ ! -S "${XDG_RUNTIME_DIR}/pulse/native" ]; then
        pipewire & pipewire-pulse & wireplumber &
      fi
      for i in $(seq 1 20); do
        [ -S "${XDG_RUNTIME_DIR}/pulse/native" ] && break
        sleep 0.5
      done
      exec env -u LD_PRELOAD selkies --public --addr 0.0.0.0 --port 8080 \
        --enable-basic-auth=false \
        --encoder=x264enc
      EOF
      chmod +x /usr/local/bin/selkies-session
      # TLS wrapper: https 8443 -> http 8080
      openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=localhost" \
        -keyout /etc/ssl/selkies.pem -out /tmp/sk.crt
      cat /tmp/sk.crt >>/etc/ssl/selkies.pem && rm /tmp/sk.crt
      printf '[Unit]\nDescription=Selkies TLS wrapper 8443->8080\nAfter=network.target\n[Service]\nExecStart=/usr/bin/socat OPENSSL-LISTEN:8443,fork,cert=/etc/ssl/selkies.pem,verify=0 TCP:127.0.0.1:8080\nRestart=always\n[Install]\nWantedBy=multi-user.target\n' \
        >/etc/systemd/system/selkies-tls.service
      systemctl enable selkies-tls
      printf '[Desktop Entry]\nType=Application\nName=Selkies\nExec=selkies-session\n' \
        >/etc/xdg/autostart/selkies.desktop
      chmod 644 /etc/xdg/autostart/selkies.desktop
      # chromium (CloakBrowser stealth build): pip pkg auto-downloads binary
      echo 'kernel.apparmor_restrict_unprivileged_userns = 0' >/etc/sysctl.d/99-chromium-userns.conf
      sysctl -p /etc/sysctl.d/99-chromium-userns.conf
      wait $CB; [ -f /tmp/cb.ok ] || { cat /tmp/cb.log >&2; exit 1; }
      if [ -d /root/.cloakbrowser ]; then
        install -d /opt/cloakbrowser
        CRBIN=$(ls -d /root/.cloakbrowser/chromium-*/chrome | head -1)
        mv "$(dirname "$CRBIN")" /opt/cloakbrowser/
      fi
      CRBIN=$(ls -d /opt/cloakbrowser/chromium-*/chrome | head -1)
      # extensions (MV3/dNR): chrome must WRITE _metadata cache into ext dir -> user-owned
      [ -n "$EXT" ] && { wait $EXT; [ -f /tmp/ext.ok ] || { cat /tmp/ext.log >&2; exit 1; }; }
      chown -R {{.User}}: /usr/local/share/extensions
      printf '#!/bin/sh\nexec %s --no-default-browser-check --load-extension=/usr/local/share/extensions/i-still-dont-care-about-cookies,/usr/local/share/extensions/ublock-origin-lite "$@"\n' "$CRBIN" >/usr/local/bin/chromium-wrapper
      chmod 755 /usr/local/bin/chromium-wrapper
      for n in chrome chromium chromium-browser; do ln -sf /usr/local/bin/chromium-wrapper /usr/local/bin/$n; done
      # .desktop + defaults
      install -d /usr/local/share/applications
      printf '[Desktop Entry]\nVersion=1.0\nName=Chromium\nGenericName=Web Browser\nExec=/usr/local/bin/chromium --no-first-run --hide-crash-restore-bubble %%u\nTerminal=false\nType=Application\nIcon=chromium\nCategories=Network;WebBrowser;\nMimeType=x-scheme-handler/http;x-scheme-handler/https;\nStartupWMClass=Chromium\n' \
        >/usr/local/share/applications/chromium.desktop
      # snap-style duplicate name: chromium looks for it when deciding "is default"
      cp /usr/local/share/applications/chromium.desktop /usr/local/share/applications/chromium_chromium.desktop
      update-desktop-database /usr/local/share/applications || true
      chmod 755 /usr/local/share/applications
      chmod 644 /usr/local/share/applications/chromium.desktop /usr/local/share/applications/chromium_chromium.desktop
      printf 'WebBrowser=chromium\nTerminalEmulator=debian-x-terminal-emulator\n' >/etc/xdg/xfce4/helpers.rc
      # startup page (managed policy)
      install -d /etc/chromium/policies/managed
      printf '{"RestoreOnStartup":4,"RestoreOnStartupURLs":["https://browserleaks.com/ip"]}\n' \
        >/etc/chromium/policies/managed/startup.json
      printf '[Default Applications]\nx-scheme-handler/http=chromium_chromium.desktop\nx-scheme-handler/https=chromium_chromium.desktop\n' >/etc/xdg/mimeapps.list
      # per-user default too (xfce/xdg reads it before root one settles; survives reboot)
      UHOME=$(getent passwd {{.User}} | cut -d: -f6)
      install -d -o {{.User}} -m 755 "$UHOME/.config"
      printf '[Default Applications]\nx-scheme-handler/http=chromium_chromium.desktop\nx-scheme-handler/https=chromium_chromium.desktop\nx-scheme-handler/chromium_chromium.desktop=chromium_chromium.desktop\n' >"$UHOME/.config/mimeapps.list"
      chown {{.User}}: "$UHOME/.config/mimeapps.list"
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      systemctl set-default graphical.target
      systemctl isolate graphical.target
  # provisioning disabled for now — re-enable to bootstrap configent
  # - mode: user
  #   script: |
  #     #!/bin/sh
  #     [ -f /etc/environment ] && set -a && . /etc/environment && set +a
  #     curl -fsSL https://raw.githubusercontent.com/raas-dev/configent/main/install.sh | sh &

probes:
  - description: "Xorg to be installed"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 60s bash -c "until command -v Xorg >/dev/null 2>&1; do sleep 3; done"; then
        echo >&2 "Xorg is not installed yet"
        exit 1
      fi
    hint: See "/var/log/cloud-init-output.log" in the guest
  - description: "Selkies to be installed"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 240s bash -c "until command -v selkies >/dev/null 2>&1; do sleep 5; done"; then
        echo >&2 "Selkies is not installed yet"
        exit 1
      fi
    hint: See "/var/log/cloud-init-output.log" in the guest

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true

portForwards:
  - guestPort: 8080
    hostPort: 8080
  - guestPort: 8443
    hostPort: 8443

# https://lima-vm.io/docs/config/network/#lima-user-v2-network
networks:
  - lima: user-v2
