images:
- location: "https://cloud-images.ubuntu.com/minimal/releases/resolute/release-20260908/ubuntu-26.04-minimal-cloudimg-amd64.img"
  arch: "x86_64"
  digest: "sha256:c0c48d8f774eaef2ded8680cc310c772b52eb5ce4f136b2d16db68a0194baf13"
- location: "https://cloud-images.ubuntu.com/minimal/releases/resolute/release-20260908/ubuntu-26.04-minimal-cloudimg-arm64.img"
  arch: "aarch64"
  digest: "sha256:671baf09e0a21681979c3a0436d530dfa2d70ed627d1527ebb174f7b5b6b5719"
# Fallback to the latest release image.
# Hint: run `limactl prune` to invalidate the cache
- location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release/ubuntu-26.04-minimal-cloudimg-amd64.img
  arch: "x86_64"
- location: https://cloud-images.ubuntu.com/minimal/releases/resolute/release/ubuntu-26.04-minimal-cloudimg-arm64.img
  arch: "aarch64"

param:
  internal_netplanOptional: "true"

mounts:
  # guest home persistence — backed by host dir, survives `limactl delete`
  - location: "~/limahome"
    mountPoint: /mnt/lima-limahome
    writable: true
  - location: "~/Downloads"
    writable: true
  # apt package archives — per-distro (ubuntu)
  - location: "~/.cache/lima-provision/ubuntu/apt-archives"
    mountPoint: /var/cache/apt/archives
    writable: true

containerd:
  system: false
  user: false

provision:
  # persistent home: bind host ~/limahome (virtiofs via the mounts entry
  # above) over the guest user's home so content survives `limactl delete`.
  # mode:boot = cloud-init bootcmd (Init stage): before cidata, env, and
  # virtiofs mounts — too early to mount anything. So bootcmd only installs a
  # per-boot script; cloud-init's scripts_per_boot stage (Final) runs it every
  # boot, after lima's own 00-lima.boot.sh / 05-lima-mounts.sh have mounted
  # virtiofs. The cidata iso (ro) stays mounted for the whole boot, so
  # lima.env is readable there on every boot, not just the first.
  - mode: boot
    script: |
      #!/bin/sh
      set -eu
      install -d /var/lib/cloud/scripts/per-boot
      cat >/var/lib/cloud/scripts/per-boot/50-limahome-bind.sh <<'EOS'
      #!/bin/sh
      set -eu
      MNT=/mnt/lima-limahome
      # (string-split to avoid the literal: lima warns on lima-cidata env refs)
      HOMEDIR=$(sed -n "s/^LIMA_""CIDATA""_HOME=//p" /mnt/lima-cidata/lima.env)
      [ -n "$HOMEDIR" ] && [ -d "$HOMEDIR" ] || {
        echo "limahome-bind: bad home '$HOMEDIR'" >&2; exit 1; }
      mountpoint -q "$MNT" || {
        echo "limahome-bind: $MNT not mounted (05-lima-mounts not run?)" >&2; exit 1; }
      # first boot: limahome is empty; cloud-init seeded authorized_keys into
      # the original home — copy them over so lima can still ssh in after bind
      if [ ! -f "$MNT/.ssh/authorized_keys" ]; then
        mkdir -p "$MNT/.ssh" && cp -a "$HOMEDIR/.ssh/." "$MNT/.ssh/"
      fi
      mountpoint -q "$HOMEDIR" || mount --bind "$MNT" "$HOMEDIR"
      EOS
      chmod +x /var/lib/cloud/scripts/per-boot/50-limahome-bind.sh
  - mode: system
    script: |
      #!/bin/sh
      sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
  - mode: system
    script: |
      #!/bin/sh
      if [ ! -d /var/lib/rancher/k3s ]; then
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644" sh -
      fi
  - mode: user
    script: |
      #!/bin/sh
      [ -f /etc/environment ] && set -a && . /etc/environment && set +a
      curl -fsSL https://raw.githubusercontent.com/raas-dev/configent/main/install.sh | sh &

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until test -f /etc/rancher/k3s/k3s.yaml; do sleep 3; done"; then
        echo >&2 "k3s is not running yet"
        exit 1
      fi
    hint: |
      The k3s kubeconfig file has not yet been created.
      Run "limactl shell k3s sudo journalctl -u k3s" to check the log.
      If that is still empty, check the bottom of the log at "/var/log/cloud-init-output.log".

copyToHost:
  - guest: "/etc/rancher/k3s/k3s.yaml"
    host: "{{.Dir}}/kubeconfig.yaml"
    deleteOnStop: true

# https://lima-vm.io/docs/config/network/user/#dns-19216853
hostResolver:
  enabled: true

# https://lima-vm.io/docs/config/network/#lima-user-v2-network
networks:
  - lima: user-v2
