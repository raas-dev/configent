  - default
  - slow
ask:
  timeout: 30
enabledProviders: []
personality: default
find:
  enabled: auto
title:
  generator: fork
  icons: boring
isolation:
  backend: auto
ratchet:
  enabled: true
textVerbosity: medium
loop:
  mode: prompt
exa:
  enabled: true
