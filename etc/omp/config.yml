modelRoles:
  default: zai/glm-5.3
  smol: zai/glm-5.3-flash
  slow: zai/glm-5.3
  vision: zai/glm-5.3
  plan: zai/glm-5.3
  commit: zai/glm-5.3
renderMermaid:
  enabled: true
checkpoint:
  enabled: true
inspect_image:
  mode: "on"
calc:
  enabled: true
commands:
  enableClaudeProject: false
  enableClaudeUser: false
  enableOpencodeUser: false
  enableOpencodeProject: false
providers:
  webSearchOrder:
    - exa
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
defaultThinkingLevel: medium
disabledProviders:
  - cursor
  - opencode
  - claude
  - claude-plugins
theme:
  dark: ayu-dark
task:
  disabledAgents:
    - cavecrew-builder
    - cavecrew-investigator
    - cavecrew-reviewer
    - designer
  isolation:
    mode: none
  eager: always
interruptMode: immediate
followUpMode: one-at-a-time
startup:
  quiet: true
  checkUpdate: false
  changelogMode: summary
github:
  enabled: true
todo:
  eager: default
  remindersMax: 5
async:
  enabled: true
mcp:
  notifications: true
secrets:
  enabled: true
statusLine:
  preset: default
  separator: powerline-thin
hideThinkingBlock: true
retry:
  fallbackRevertPolicy: cooldown-expiry
steeringMode: all
completion:
  notify: "on"
compaction:
  thresholdPercent: 60
  thresholdTokens: -1
  methodOrder:
    - remote
    - soft
bash:
  autoBackground:
    enabled: true
dev:
  autoqa: true
treeFilterMode: user-only
autocompleteMaxVisible: 20
shellMinimizer:
  enabled: true
setupVersion: 2
composer:
  shape: box
