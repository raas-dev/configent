modelRoles:
  default: minimax/MiniMax-M3
  smol: minimax/MiniMax-M3
  slow: minimax/MiniMax-M3
  vision: minimax/MiniMax-M3
  plan: minimax/MiniMax-M3
  commit: minimax/MiniMax-M3
  tiny: minimax/MiniMax-M3
  designer: minimax/MiniMax-M3
  task: minimax/MiniMax-M3
  advisor: minimax/MiniMax-M3
  web: web/exa
renderMermaid:
  enabled: true
checkpoint:
  enabled: true
calc:
  enabled: true
commands:
  enableClaudeProject: true
  enableClaudeUser: true
  enableOpencodeUser: true
  enableOpencodeProject: true
providers:
  openai-codex:
    codeMode: "off"
  tinyModelDevice: default
  autoThinkingMaxEffort: xhigh
  fetch: auto
defaultThinkingLevel: auto
disabledProviders:
  - cursor
  - opencode
  - github
  - claude
theme:
  dark: dark-ayu
task:
  disabledAgents: []
  isolation:
    enabled: false
  eager: preferred
  enableEffort: false
  maxConcurrency: 8
  maxRecursionDepth: 2
  maxRuntimeMs: 0
  maxEffort: high
interruptMode: immediate
followUpMode: one-at-a-time
startup:
  quiet: true
  checkUpdate: false
  changelogMode: hidden
  setupWizard: false
github:
  enabled: true
todo:
  eager: default
  remindersMax: 5
async:
  enabled: true
mcp:
  notifications: true
secrets:
  enabled: true
statusLine:
  preset: custom
  separator: none
  leftSegments:
    - pi
    - hostname
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - session_name
    - subagents
  rightSegments:
    - token_total
    - context_pct
    - usage
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
  contextLine: percentage
  sessionAccent: false
  transparent: true
  compactThinkingLevel: false
  showHookStatus: true
hideThinkingBlock: true
retry:
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    web:
      - minimax/MiniMax-M3
  maxRetries: 10
steeringMode: all
completion:
  notify: "on"
compaction:
  thresholdPercent: 50
  thresholdTokens: 200000
  methodOrder:
    - shake
    - soft
    - handoff
  idleThresholdTokens: 200000
bash:
  autoBackground:
    enabled: true
  gitGuard: true
  allowCompoundCommands: false
dev:
  autoqa: false
treeFilterMode: user-only
autocompleteMaxVisible: 20
shellMinimizer:
  enabled: true
  sourceOutlineLevel: default
setupVersion: 2
composer:
  shape: field
  tokenRate: false
tui:
  textSizing: false
  tight: false
  resizeScrollback: rebuild
  imeSafeCursor: true
  titleSpinner: braille
  reactions: true
  mouse: false
display:
  showTokenUsage: true
  shimmer: classic
  subagentLivePreview: false
  pinnedAgents: collapsed
  showTurnTime: true
terminal:
  showProgress: true
symbolPreset: nerd
colorBlindMode: false
doubleEscapeAction: tree
tools:
  approvalMode: yolo
  xdevDocs: builtins
  maxTimeout: 600
error:
  notify: "on"
stt:
  enabled: true
  submitTrigger: never
marketplace:
  autoUpdate: auto
power:
  sleepPrevention: idle
features:
  unexpectedStopDetection: mechanical
snapcompact:
  shape: auto
memory:
  backend: "off"
autolearn:
  enabled: false
edit:
  mode: hashline
python:
  kernelMode: session
astGrep:
  enabled: true
computer:
  enabled: true
  display: all
generate_image:
  enabled: false
security:
  enabled: true
speechgen:
  enabled: false
plan:
  enabled: true
tts:
  localVoice: af_heart
live:
  voice: sol
