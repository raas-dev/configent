Section "ServerLayout"
  Identifier "layout"
  Screen 0 "Screen0"
EndSection
Section "Device"
  Identifier "dummy"
  Driver "dummy"
  VideoRam 32768
EndSection
Section "Monitor"
  Identifier "monitor0"
  HorizSync 5.0-1000.0
  VertRefresh 5.0-200.0
EndSection
Section "Screen"
  Identifier "Screen0"
  Device "dummy"
  Monitor "monitor0"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "2560x1440"
    Virtual 2560 1440
  EndSubSection
EndSection
